<div class="ms404-wrap">
  <div class="ms404-hud">
    <div class="ms404-title">ERROR 404</div>
    <div class="ms404-sub">OBJETIVO NO ENCONTRADO &mdash; MIENTRAS ESPERAS, ELIMINA AL ENEMIGO</div>
  </div>

  <div class="ms404-stage">
    <canvas class="ms404-canvas" width="480" height="200"></canvas>

    <div class="ms404-score">
      <span class="ms404-score-label">PUNTOS</span>
      <span class="ms404-score-value">0</span>
      <span class="ms404-lives"></span>
    </div>

    <div class="ms404-overlay ms404-start">
      <p>PULSA PARA EMPEZAR</p>
      <p class="ms404-help">Flechas / A-D: mover&nbsp;&nbsp;·&nbsp;&nbsp;Espacio: saltar&nbsp;&nbsp;·&nbsp;&nbsp;Z / clic: disparar</p>
    </div>

    <div class="ms404-overlay ms404-over" hidden>
      <p>MISIÓN FALLIDA</p>
      <p class="ms404-help ms404-final-score"></p>
      <button type="button" class="ms404-btn ms404-retry">REINTENTAR</button>
    </div>
  </div>

  <div class="ms404-controls">
    <div class="ms404-pad">
      <button type="button" class="ms404-key" data-key="left">◀</button>
      <button type="button" class="ms404-key" data-key="right">▶</button>
      <button type="button" class="ms404-key" data-key="jump">SALTAR</button>
      <button type="button" class="ms404-key" data-key="fire">FUEGO</button>
    </div>
    <a href="/" class="ms404-btn ms404-home">VOLVER A LA BASE</a>
  </div>
</div>

<style>
.ms404-wrap{
  --ms-sand:#d8c084;
  --ms-sand-dark:#b89b5e;
  --ms-green:#3f5d3a;
  --ms-green-dark:#2a3f26;
  --ms-red:#b3402f;
  --ms-ink:#20241c;
  max-width:720px;
  margin:0 auto;
  font-family:'Courier New',Courier,monospace;
  color:var(--ms-ink);
  user-select:none;
  -webkit-user-select:none;
}
.ms404-hud{ text-align:center; margin-bottom:12px; }
.ms404-title{
  font-size:clamp(32px,7vw,54px);
  font-weight:700;
  letter-spacing:6px;
  color:var(--ms-green-dark);
  text-shadow:3px 3px 0 var(--ms-sand-dark);
}
.ms404-sub{
  font-size:clamp(11px,2.4vw,14px);
  letter-spacing:1px;
  color:var(--ms-ink);
  margin-top:4px;
}
.ms404-stage{
  position:relative;
  border:4px solid var(--ms-ink);
  border-radius:4px;
  box-shadow:0 6px 0 var(--ms-ink);
  overflow:hidden;
  background:#7fa66b;
}
.ms404-canvas{
  display:block;
  width:100%;
  height:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.ms404-score{
  position:absolute;
  top:8px; left:8px;
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.45);
  color:#f4e9c9;
  padding:4px 8px;
  font-size:12px;
  letter-spacing:1px;
  border-radius:3px;
}
.ms404-score-value{ font-weight:700; }
.ms404-lives{ margin-left:6px; letter-spacing:2px; }
.ms404-overlay{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px;
  background:rgba(10,15,8,.72);
  color:#f4e9c9;
  text-align:center;
  cursor:pointer;
  font-size:20px;
  letter-spacing:2px;
}
.ms404-overlay p{ margin:0; }
.ms404-help{ font-size:12px; letter-spacing:.5px; opacity:.85; }
.ms404-btn{
  font-family:inherit;
  font-size:13px;
  letter-spacing:1px;
  padding:8px 18px;
  background:var(--ms-red);
  color:#fff;
  border:2px solid var(--ms-ink);
  border-radius:3px;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 3px 0 var(--ms-ink);
}
.ms404-btn:hover{ filter:brightness(1.1); }
.ms404-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ms-ink); }
.ms404-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
  flex-wrap:wrap;
}
.ms404-pad{ display:flex; gap:6px; flex-wrap:wrap; }
.ms404-key{
  font-family:inherit;
  font-size:12px;
  letter-spacing:1px;
  padding:8px 12px;
  background:var(--ms-green);
  color:#f4e9c9;
  border:2px solid var(--ms-ink);
  border-radius:3px;
  cursor:pointer;
  box-shadow:0 3px 0 var(--ms-ink);
}
.ms404-key:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ms-ink); }
@media (min-width:640px){
  .ms404-pad{ display:none; }
}
</style>

<script>
(function(){
  function init(root){
    if(root.dataset.ms404Init) return;
    root.dataset.ms404Init = '1';

    var canvas = root.querySelector('.ms404-canvas');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var GROUND = H - 30;

    var scoreEl = root.querySelector('.ms404-score-value');
    var livesEl = root.querySelector('.ms404-lives');
    var startOverlay = root.querySelector('.ms404-start');
    var overOverlay = root.querySelector('.ms404-over');
    var finalScoreEl = root.querySelector('.ms404-final-score');
    var retryBtn = root.querySelector('.ms404-retry');

    var keys = {};
    var running = false;
    var rafId = null;

    var player, bullets, enemies, score, lives, spawnTimer, elapsed;

    function resetGame(){
      player = { x:40, y:GROUND-24, w:14, h:24, vx:0, vy:0, dir:1, onGround:true, cooldown:0, hurt:0 };
      bullets = [];
      enemies = [];
      score = 0;
      lives = 3;
      spawnTimer = 0;
      elapsed = 0;
      updateHud();
    }

    function updateHud(){
      scoreEl.textContent = score;
      livesEl.textContent = '♥'.repeat(Math.max(lives,0));
    }

    function spawnEnemy(){
      var speed = 0.6 + Math.random()*0.5 + Math.min(score/500,1);
      enemies.push({ x:W+10, y:GROUND-22, w:14, h:22, vx:-speed, alive:true });
    }

    function rectsOverlap(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function update(dt){
      elapsed += dt;

      var left = keys.left, right = keys.right;
      player.vx = 0;
      if(left){ player.vx = -1.4; player.dir = -1; }
      if(right){ player.vx = 1.4; player.dir = 1; }
      if(keys.jump && player.onGround){ player.vy = -4.6; player.onGround = false; }

      player.vy += 0.28;
      player.x += player.vx;
      player.y += player.vy;
      if(player.x < 4) player.x = 4;
      if(player.x > W-player.w-4) player.x = W-player.w-4;
      if(player.y >= GROUND-player.h){ player.y = GROUND-player.h; player.vy = 0; player.onGround = true; }

      if(player.cooldown > 0) player.cooldown -= dt;
      if(keys.fire && player.cooldown <= 0){
        bullets.push({ x: player.x + (player.dir>0?player.w:0), y: player.y+9, w:6, h:2, vx: player.dir*5 });
        player.cooldown = 220;
      }
      if(player.hurt > 0) player.hurt -= dt;

      bullets.forEach(function(b){ b.x += b.vx; });
      bullets = bullets.filter(function(b){ return b.x > -10 && b.x < W+10; });

      spawnTimer -= dt;
      if(spawnTimer <= 0){
        spawnEnemy();
        spawnTimer = Math.max(1500 - score*8, 550);
      }

      enemies.forEach(function(e){
        e.x += e.vx;
      });

      bullets.forEach(function(b){
        enemies.forEach(function(e){
          if(e.alive && rectsOverlap(b, e)){
            e.alive = false;
            b.x = -999;
            score += 10;
            updateHud();
          }
        });
      });

      enemies.forEach(function(e){
        if(e.alive && player.hurt <= 0 && rectsOverlap(player, e)){
          e.alive = false;
          lives -= 1;
          player.hurt = 900;
          updateHud();
          if(lives <= 0) gameOver();
        }
      });

      enemies = enemies.filter(function(e){ return e.alive && e.x > -20; });
    }

    function drawSoldier(x,y,w,h,color,dir,legPhase){
      ctx.fillStyle = color;
      ctx.fillRect(x+w*0.2, y, w*0.6, h*0.4);
      ctx.fillStyle = '#f0c896';
      ctx.fillRect(x+w*0.3, y-h*0.18, w*0.4, h*0.2);
      ctx.fillStyle = color;
      ctx.fillRect(x, y+h*0.4, w, h*0.3);
      var legOff = Math.sin(legPhase)*2;
      ctx.fillRect(x+w*0.15+legOff, y+h*0.7, w*0.3, h*0.3);
      ctx.fillRect(x+w*0.55-legOff, y+h*0.7, w*0.3, h*0.3);
      ctx.fillStyle = '#555';
      var gx = dir>0 ? x+w : x-6;
      ctx.fillRect(gx, y+h*0.42, 6, 3);
    }

    function draw(){
      ctx.fillStyle = '#bfe0a8';
      ctx.fillRect(0,0,W,GROUND);
      ctx.fillStyle = '#e7d9a3';
      ctx.beginPath();
      ctx.arc(60,40,26,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#5f7a3f';
      for(var i=0;i<6;i++){
        ctx.beginPath();
        ctx.arc(60+i*90 - (elapsed*0.02)%90, GROUND-4, 18, Math.PI, 0);
        ctx.fill();
      }

      ctx.fillStyle = '#8a6b3d';
      ctx.fillRect(0, GROUND, W, H-GROUND);
      ctx.fillStyle = '#6f5329';
      for(var s=0;s<W;s+=20){
        ctx.fillRect((s - (elapsed*0.05)%20), GROUND, 10, 4);
      }

      if(player.hurt <= 0 || Math.floor(elapsed/80)%2===0){
        drawSoldier(player.x, player.y, player.w, player.h, '#3f5d3a', player.dir, elapsed/70);
      }

      ctx.fillStyle = '#e8d98a';
      bullets.forEach(function(b){ ctx.fillRect(b.x,b.y,b.w,b.h); });

      enemies.forEach(function(e){
        drawSoldier(e.x, e.y, e.w, e.h, '#b3402f', -1, elapsed/70 + e.x);
      });
    }

    function loop(ts){
      if(!running) return;
      if(!loop.last) loop.last = ts;
      var dt = ts - loop.last;
      loop.last = ts;
      update(dt);
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function gameOver(){
      running = false;
      cancelAnimationFrame(rafId);
      finalScoreEl.textContent = 'PUNTUACIÓN: ' + score;
      overOverlay.hidden = false;
    }

    function startGame(){
      resetGame();
      startOverlay.hidden = true;
      overOverlay.hidden = true;
      running = true;
      loop.last = null;
      rafId = requestAnimationFrame(loop);
    }

    startOverlay.addEventListener('click', startGame);
    retryBtn.addEventListener('click', function(e){ e.stopPropagation(); startGame(); });

    window.addEventListener('keydown', function(e){
      if(!root.contains(document.activeElement) && document.activeElement !== document.body) return;
      setKey(e.key, true, e);
    });
    window.addEventListener('keyup', function(e){ setKey(e.key, false, e); });

    function setKey(key, down, evt){
      var map = { 'ArrowLeft':'left','a':'left','A':'left',
                  'ArrowRight':'right','d':'right','D':'right',
                  ' ':'jump','Spacebar':'jump',
                  'z':'fire','Z':'fire' };
      var action = map[key];
      if(action){
        keys[action] = down;
        if(evt && (action==='jump' || action==='fire')) evt.preventDefault();
      }
    }

    root.querySelectorAll('.ms404-key').forEach(function(btn){
      var action = btn.dataset.key;
      var press = function(e){ e.preventDefault(); keys[action] = true; };
      var release = function(e){ e.preventDefault(); keys[action] = false; };
      btn.addEventListener('touchstart', press, {passive:false});
      btn.addEventListener('touchend', release);
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });

    canvas.addEventListener('mousedown', function(){ keys.fire = true; });
    canvas.addEventListener('mouseup', function(){ keys.fire = false; });

    resetGame();
    draw();
  }

  function boot(){
    document.querySelectorAll('.ms404-wrap').forEach(init);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
